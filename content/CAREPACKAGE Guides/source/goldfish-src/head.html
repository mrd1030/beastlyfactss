<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Goldfish Care Package</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap');

@page{size:8.5in 11in;margin:0;} /* fixes a Chromium print-to-PDF rounding gap at the bottom edge of every page - keep this on every guide */

:root{
  --ink:#2B2420;
  --muted:#6E6459;
  --faint:#A79E92;
  --paper:#FFFFFF;
  --cream:#FBF7F0;
  --line:#E4DCCC;
  --accent:#1E7FA0;
  --accent-dark:#155E76;
  --accent-tint:#D9EDF3;
  --danger:#9B3226;
  --danger-tint:#F6E2DE;
  --good:#4F6B44;
  --good-tint:#E7EEE1;
  --info:#3D5A73;
  --info-tint:#DFE8ED;
  --warn:#8A6A1F;
  --warn-tint:#F3E9D2;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#DCD5C8;}
.page{
  position:relative;
  width:8.5in;
  height:11in;
  background:var(--paper);
  padding:0.62in 0.66in 0.55in 0.66in;
  font-family:'Inter',sans-serif;
  color:var(--ink);
  break-after:page;
  overflow:hidden;
}
.page:last-child{break-after:auto;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;color:var(--ink);}
.eyebrow{
  font-family:'Inter',sans-serif;font-weight:700;font-size:9.5pt;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--accent);margin-bottom:4pt;
}
.pagefoot{
  position:absolute;bottom:0.3in;left:0.66in;right:0.66in;
  display:flex;justify-content:space-between;align-items:center;
  font-size:8pt;color:var(--faint);border-top:0.75pt solid var(--line);padding-top:6pt;
}
.pagefoot .brand{font-family:'Fraunces',serif;font-weight:600;color:var(--faint);}
p{line-height:1.5;font-size:10.3pt;color:var(--ink);}
.muted{color:var(--muted);}
ul,ol{padding-left:16pt;margin-top:4pt;}
li{line-height:1.5;font-size:10.3pt;margin-bottom:3pt;}
table{width:100%;border-collapse:collapse;margin-top:8pt;font-size:9.7pt;}
th{
  text-align:left;background:var(--accent-tint);color:var(--accent-dark);
  font-family:'Inter',sans-serif;font-weight:700;font-size:8.6pt;letter-spacing:0.04em;
  text-transform:uppercase;padding:6pt 9pt;
}
td{padding:7pt 9pt;border-bottom:0.75pt solid var(--line);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.callout{border-radius:8pt;padding:11pt 14pt;margin:10pt 0;border-left:3.5pt solid;font-size:10.3pt;line-height:1.5;}
.callout .label{font-family:'Inter',sans-serif;font-weight:800;font-size:8.6pt;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:3pt;display:block;}
.callout.never{background:var(--danger-tint);border-color:var(--danger);}
.callout.never .label{color:var(--danger);}
.callout.tip{background:var(--good-tint);border-color:var(--good);}
.callout.tip .label{color:var(--good);}
.callout.info{background:var(--info-tint);border-color:var(--info);}
.callout.info .label{color:var(--info);}
.callout.warn{background:var(--warn-tint);border-color:var(--warn);}
.callout.warn .label{color:var(--warn);}
.section-title{font-size:19pt;margin-bottom:2pt;}
.section-sub{font-size:9.8pt;color:var(--muted);margin-bottom:12pt;}
.chip{
  display:inline-block;font-size:8.3pt;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;
  background:var(--accent-tint);color:var(--accent-dark);border-radius:20pt;padding:3pt 10pt;margin-right:5pt;
}
.check-item{display:flex;gap:8pt;align-items:flex-start;margin-bottom:6pt;font-size:10pt;line-height:1.45;}
.box{width:10pt;height:10pt;border:1.4pt solid var(--faint);border-radius:2.5pt;flex-shrink:0;margin-top:2pt;}
.two-col{display:flex;gap:24pt;}
.col{flex:1;}
.divider{height:0.75pt;background:var(--line);margin:12pt 0;}
h2.h{font-size:13.5pt;margin:14pt 0 5pt 0;}
h3.h{font-size:11pt;margin:10pt 0 4pt 0;color:var(--accent-dark);}
.small{font-size:8.8pt;color:var(--faint);}
.toc-label{font-family:'Inter',sans-serif;font-weight:700;font-size:9pt;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);margin-top:6pt;margin-bottom:1pt;border-bottom:1pt solid var(--line);padding-bottom:3pt;}
.toc-label:first-of-type{margin-top:10pt;}
.toc table{margin-top:0;}
.toc td{padding:1.4pt 0;border-bottom:none;font-size:9.2pt;line-height:1.3;}

/* v3 additions */
.tier{display:inline-block;font-size:7.6pt;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;border-radius:20pt;padding:2pt 7pt;white-space:nowrap;}
.tier.staple{background:var(--good-tint);color:var(--good);}
.tier.occasional{background:var(--accent-tint);color:var(--accent-dark);}
.tier.rare{background:var(--warn-tint);color:var(--warn);}
.tier.never{background:var(--danger-tint);color:var(--danger);}
table.dense{font-size:8.8pt;margin-top:6pt;}
table.dense td{padding:3.2pt 7pt;line-height:1.38;}
table.dense th{padding:5pt 7pt;}
table.log td{height:25pt;}
table.log.tall td{height:30pt;}
.fill{display:flex;gap:8pt;align-items:flex-end;margin:8pt 0;font-size:9.8pt;}
.fill .lab{color:var(--muted);font-weight:600;white-space:nowrap;}
.fill .line{flex:1;border-bottom:0.9pt solid var(--faint);height:13pt;}
.cards{display:flex;gap:10pt;margin-top:8pt;}
.card{flex:1;border:0.9pt solid var(--line);border-radius:8pt;padding:9pt 11pt;background:var(--cream);}
.card h4{font-family:'Inter',sans-serif;font-size:8.6pt;text-transform:uppercase;letter-spacing:0.06em;color:var(--accent-dark);margin-bottom:4pt;}
.card p{font-size:9.3pt;line-height:1.45;}
.compact p,.compact li{font-size:9.8pt;}
.tight p{margin-bottom:5pt;}
</style>
</head>
<body>
