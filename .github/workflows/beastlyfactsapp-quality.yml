name: beastlyfactsapp-quality

on:
  pull_request:
    paths:
      - 'beastlyfactsapp/**'
      - '.github/workflows/beastlyfactsapp-quality.yml'
  push:
    branches: [main]
    paths:
      - 'beastlyfactsapp/**'
      - '.github/workflows/beastlyfactsapp-quality.yml'

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beastlyfactsapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: beastlyfactsapp/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
