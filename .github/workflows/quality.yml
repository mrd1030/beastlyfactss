name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Audits what ships to visitors. The build-only tools (Tailwind, PurgeCSS,
      # patch-package) pull in braces, whose stack-exhaustion advisory
      # (GHSA-vfj7-8cjw-p6xm) covers every published version, so no fix exists
      # to install yet. Run a full `npm audit` by hand now and then to see
      # when one lands.
      - name: Dependency audit (high+, shipped dependencies)
        run: npm audit --omit=dev --audit-level=high
