<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" sizes="256x256" href="./src/assets/favicon.webp">
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon-180.png">
    <link rel="manifest" href="/manifest.json">
    <!-- Dark is this site's default (useDarkMode in useLocalStorage.js
         defaults to true), so this static fallback matches that rather than
         white - useDarkMode itself keeps this in sync with the live toggle
         after mount (see its .dark class effect). -->
    <meta name="theme-color" content="#101412">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Beastly Facts">
    <!-- iOS splash screens: Safari renders these before any JS runs, one per
         device size/DPR combo (no auto-generation like Android gets from the
         manifest icon) -->
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1080x2340.png" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1668x2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-2048x2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1620x2160.png" media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Android/standalone-launch splash: Chrome only auto-generates a splash
         from the manifest icon+color (no custom-image support), so this fakes
         one for installed-app launches only. Hidden by default; the inline
         script below reveals it synchronously (before paint) just for
         standalone launches so normal browser tab visits never see it. -->
    <style>
      #app-splash{position:fixed;inset:0;z-index:9999;background:#feeed5;display:none;align-items:center;justify-content:center;opacity:1;transition:opacity .25s ease}
      #app-splash.is-visible{display:flex}
      #app-splash.is-hiding{opacity:0}
      #app-splash img{max-width:55vw;max-height:55vh;object-fit:contain}
    </style>

    <!-- Homepage fallback meta - for social bots (no JS) and Googlebot first-pass crawl.
         NO canonical here: react-helmet-async injects the correct one per-route.
         Two canonicals = Google ignores both. -->
    <title>Beastly Facts | Amazing Animal Trivia, Guides &amp; Fun Quizzes</title>
    <!-- Open Graph - site-wide only; per-page og:url/title/description/type/image injected
         by react-helmet-async. og:image (+width/height/alt) intentionally NOT duplicated here - every page now sets its own via Helmet, and a static leftover here would sit alongside
         Helmet's per-page override as a second, stale og:image tag (same failure mode already
         fixed for meta name="description"). Crawlers reading the first of two conflicting
         og:image tags would get this generic one instead of the per-post image. -->
    <meta property="og:site_name" content="Beastly Facts" />

    <!-- Twitter Card - twitter:card intentionally NOT duplicated here for the same
         reason as og:image above: every page now sets its own via Helmet (including
         Pack.jsx, which deliberately uses "summary" instead of "summary_large_image"),
         and a static leftover here would create a second, conflicting twitter:card tag. -->
    <meta name="twitter:site" content="@beastlyfacts" />

    <!-- LCP preload: hero image above fold, fetched before render -->
    <!-- Preload WebP hero (preferred by modern browsers); sizes match HeroSection srcset -->
    <link rel="preload" as="image" href="/assets/hero-1200.webp" type="image/webp" fetchpriority="high"
      imagesrcset="/assets/hero-400.webp 400w, /assets/hero-800.webp 800w, /assets/hero-1200.webp 1200w, /assets/hero-1600.webp 1600w"
      imagesizes="(max-width: 640px) 100vw, (max-width: 1024px) 90vw, 1200px" />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <!-- Fonts: self-hosted (public/fonts/, see src/index.css for the @font-face
         rules) instead of Google Fonts - preloaded directly here so the fetch
         starts immediately on HTML parse, in parallel with everything else,
         rather than waiting on the CSS that references them. font-display:
         optional (in index.css) means this preload is what makes the real
         font actually win the race and show with zero layout shift; without
         it there's nothing for "optional" to race against. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/fredoka-var.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/atkinson-hyperlegible-next-var.woff2" crossorigin>

    <meta name="p:domain_verify" content="bb226bb96315ba08f0689d0569facbcb"/>
    <!-- Chewy affiliate program (Impact) site verification -->
    <meta name='impact-site-verification' value='a5d0acbb-072a-4fff-9585-0a3a2b7e9546'>

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-N3PXSDZB');</script>
    <!-- End Google Tag Manager -->

</head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N3PXSDZB"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="app-splash"><img src="/pwa/splash-web.jpg" width="700" height="1040" alt=""></div>
    <script>
      (function () {
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        if (isStandalone) {
          document.getElementById('app-splash').classList.add('is-visible');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
